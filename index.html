<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#3b4642" />
  <title>Chamada de vídeo</title>
  <style>
:root{
  --green:#25d366;         /* verde oficial do WhatsApp */
  --green-dark:#1faa52;
  --red:#f0453a;
  --bg-top:#5a6a64;
  --bg-mid:#4a5852;
  --bg-bottom:#3b4642;
}

*{ box-sizing:border-box; margin:0; padding:0; }

html,body{ height:100%; }

body{
  font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:#0d0f0e;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

.phone{
  position:relative;
  width:100%;
  max-width:420px;
  height:100vh;
  overflow:hidden;
  background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 45%,var(--bg-bottom) 100%);
  user-select:none;
}

/* moldura de celular no desktop */
@media (min-width:480px){
  body{ background:radial-gradient(circle at 50% 0%,#1d201f,#0a0b0b); }
  .phone{
    height:860px;
    max-height:94vh;
    border-radius:40px;
    border:11px solid #0a0a0a;
    box-shadow:0 30px 90px rgba(0,0,0,.65), inset 0 0 0 2px rgba(255,255,255,.04);
  }
}

/* Vídeo do contato (tela cheia) */
.remote-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#111;
  z-index:1;
  display:none;
}
.phone[data-state="in-call"].has-remote .remote-video{ display:block; }

.video-scrim{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  display:none;
  background:linear-gradient(180deg,
    rgba(0,0,0,.5) 0%,
    rgba(0,0,0,0) 20%,
    rgba(0,0,0,0) 60%,
    rgba(0,0,0,.6) 100%);
}
.phone[data-state="in-call"].has-remote .video-scrim{ display:block; }

/* Barra de status */
.statusbar{
  position:relative;
  z-index:6;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 24px 0;
  font-size:14px;
  font-weight:600;
  letter-spacing:.3px;
}
.sysicons{ display:flex; align-items:center; gap:7px; }
.sysicons svg{ width:17px; height:17px; fill:#fff; opacity:.95; }

/* Botão silenciar */
.sound-toggle{
  position:absolute;
  top:54px;
  right:20px;
  width:42px;
  height:42px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  background:rgba(255,255,255,.14);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .2s, transform .12s;
  z-index:7;
}
.sound-toggle:hover{ background:rgba(255,255,255,.22); }
.sound-toggle:active{ transform:scale(.92); }
.sound-toggle svg{ width:20px; height:20px; fill:currentColor; }
.sound-toggle .ic-off{ display:none; }
.sound-toggle.muted{ background:rgba(255,255,255,.28); }
.sound-toggle.muted .ic-on{ display:none; }
.sound-toggle.muted .ic-off{ display:block; }
.phone:not([data-state="incoming"]) .sound-toggle{ display:none; }

/* Virar câmera */
.flip-cam{
  position:absolute;
  top:52px;
  left:20px;
  width:42px;
  height:42px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  background:rgba(0,0,0,.32);
  color:#fff;
  display:none;
  align-items:center;
  justify-content:center;
  transition:background .2s, transform .12s;
  z-index:9;
}
.flip-cam:hover{ background:rgba(0,0,0,.5); }
.flip-cam:active{ transform:scale(.92); }
.flip-cam svg{ width:22px; height:22px; fill:currentColor; }
.flip-cam.spin svg{ animation:flipspin .5s ease; }
.phone[data-state="connecting"] .flip-cam,
.phone[data-state="in-call"] .flip-cam{ display:flex; }

@keyframes flipspin{
  from{ transform:rotate(0); }
  to{ transform:rotate(360deg); }
}

/* Câmera do usuário (self view) */
.self-cam{
  position:absolute;
  top:64px;
  right:16px;
  width:104px;
  height:150px;
  border-radius:16px;
  overflow:hidden;
  background:#000;
  box-shadow:0 6px 22px rgba(0,0,0,.45);
  border:1.5px solid rgba(255,255,255,.18);
  z-index:8;
  display:none;
}
.phone[data-state="connecting"] .self-cam,
.phone[data-state="in-call"] .self-cam{ display:block; }

.self-video{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
  display:block;
  background:#000;
}
.self-placeholder{
  display:none;
  position:absolute;
  inset:0;
  align-items:center;
  justify-content:center;
  background:#2b332f;
}
.self-placeholder svg{ width:36px; height:36px; fill:rgba(255,255,255,.5); }
.self-cam.no-video .self-video,
.self-cam.off .self-video{ display:none; }
.self-cam.no-video .self-placeholder,
.self-cam.off .self-placeholder{ display:flex; }

/* Conteúdo */
.content{
  position:relative;
  z-index:5;
  text-align:center;
  padding:60px 24px 0;
}
.call-type{
  font-size:15px;
  color:rgba(255,255,255,.78);
  letter-spacing:.4px;
  margin-bottom:26px;
}

.avatar-wrap{
  position:relative;
  width:150px;
  height:150px;
  margin:0 auto 26px;
}
.avatar{
  position:absolute;
  inset:0;
  border-radius:50%;
  border:1.5px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.06);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.avatar-img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}
.avatar-fallback{ width:64px; height:64px; fill:rgba(255,255,255,.55); display:none; }
.avatar.no-photo .avatar-img{ display:none; }
.avatar.no-photo .avatar-fallback{ display:block; }

.pulse{
  position:absolute;
  inset:0;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.4);
  opacity:0;
}
.phone[data-state="incoming"] .pulse{ animation:pulse 2.4s ease-out infinite; }
.phone[data-state="incoming"] .pulse.delay{ animation-delay:1.2s; }

@keyframes pulse{
  0%{ transform:scale(1); opacity:.6; }
  100%{ transform:scale(1.9); opacity:0; }
}

.name{
  font-size:28px;
  font-weight:700;
  margin-bottom:8px;
  letter-spacing:.2px;
}
.substatus{
  font-size:15px;
  color:rgba(255,255,255,.78);
}
.timer{
  display:none;
  font-size:16px;
  color:rgba(255,255,255,.85);
  font-variant-numeric:tabular-nums;
}
.phone[data-state="in-call"] .substatus{ display:none; }
.phone[data-state="in-call"] .timer{ display:block; }

/* Chamada em andamento COM vídeo do contato: esconde avatar/título */
.phone[data-state="in-call"].has-remote .call-type,
.phone[data-state="in-call"].has-remote .avatar-wrap{ display:none; }
.phone[data-state="in-call"].has-remote .content{
  padding-top:26px;
  text-shadow:0 1px 8px rgba(0,0,0,.7);
}

/* Chamada em andamento SEM vídeo (arquivo ausente / câmera do contato desligada):
   mantém avatar e nome visíveis, como no WhatsApp */
.phone[data-state="in-call"]:not(.has-remote) .call-type{ color:rgba(255,255,255,.78); }

/* Controles */
.controls{
  position:absolute;
  left:0;
  right:0;
  bottom:52px;
  padding:0 42px;
  z-index:6;
}
.incoming-controls,
.incall-controls,
.ended-controls{ display:none; }

.phone[data-state="incoming"] .incoming-controls{ display:flex; justify-content:space-between; }
.phone[data-state="in-call"] .incall-controls{ display:flex; justify-content:center; gap:34px; }
.phone[data-state="ended"] .ended-controls{ display:flex; justify-content:center; }

.ctrl{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:11px;
}
.ctrl span{
  font-size:13px;
  color:rgba(255,255,255,.85);
}

.fab{
  width:66px;
  height:66px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  transition:transform .13s ease, filter .2s, background .2s;
  box-shadow:0 6px 18px rgba(0,0,0,.28);
}
.fab svg{ width:30px; height:30px; fill:#fff; }
.fab:active{ transform:scale(.9); }

.decline{ background:var(--red); }
.decline:hover{ filter:brightness(1.08); }

.accept{ background:var(--green); }
.accept:hover{ filter:brightness(1.08); }
.phone[data-state="incoming"] .accept{ animation:jiggle 1.4s ease-in-out infinite; }

@keyframes jiggle{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-7px); }
}

/* Em chamada */
.fab.small{
  width:58px;
  height:58px;
  background:rgba(255,255,255,.18);
  box-shadow:none;
}
.fab.small:hover{ background:rgba(255,255,255,.28); }
.fab.small.off{ background:#fff; }
.fab.small.off svg{ fill:#333; }

.fab.end{ background:var(--red); }
.fab.end svg{ transform:rotate(135deg); }

/* Encerrada */
.restart{
  padding:14px 30px;
  border-radius:30px;
  border:none;
  cursor:pointer;
  font-size:15px;
  font-weight:600;
  color:#fff;
  background:var(--green);
  transition:filter .2s, transform .12s;
  box-shadow:0 6px 18px rgba(0,0,0,.28);
}
.restart:hover{ filter:brightness(1.08); }
.restart:active{ transform:scale(.96); }
  </style>

  <script>
const phone       = document.querySelector('.phone');
const callType    = document.getElementById('callType');
const subStatus   = document.getElementById('subStatus');
const timerEl     = document.getElementById('timer');
const acceptBtn   = document.getElementById('acceptBtn');
const declineBtn  = document.getElementById('declineBtn');
const endBtn      = document.getElementById('endBtn');
const restartBtn  = document.getElementById('restartBtn');
const soundToggle = document.getElementById('soundToggle');
const muteMicBtn  = document.getElementById('muteMicBtn');
const videoBtn    = document.getElementById('videoBtn');
const flipBtn     = document.getElementById('flipBtn');

const remoteVideo = document.getElementById('remoteVideo');
const selfVideo   = document.getElementById('selfVideo');
const selfCam     = document.getElementById('selfCam');

let state      = 'incoming';
let muted      = false;
let ringing    = false;
let ringTimer  = null;
let vibTimer   = null;
let callTimer  = null;
let seconds    = 0;
let audioCtx   = null;
let flipping   = false;

let facingMode  = 'user';  // câmera PADRÃO: frontal (selfie)
let localStream = null;    // câmera/microfone do usuário

function setState(s){
  state = s;
  phone.dataset.state = s;
}

/* ---------- Áudio (toque) ---------- */
function ensureAudio(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function beep(freq, start, dur, vol = 0.16){
  if(!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.value = freq;
  o.connect(g);
  g.connect(audioCtx.destination);
  const t = audioCtx.currentTime + start;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.03);
  g.gain.setValueAtTime(vol, t + dur - 0.05);
  g.gain.linearRampToValueAtTime(0, t + dur);
  o.start(t);
  o.stop(t + dur + 0.02);
}

function ringPattern(){
  ensureAudio();
  beep(1318, 0.00, 0.18);
  beep(1046, 0.22, 0.18);
  beep(1318, 0.50, 0.18);
  beep(1046, 0.72, 0.20);
}

function startRinging(){
  if(ringing || muted) return;
  ringing = true;
  ringPattern();
  ringTimer = setInterval(ringPattern, 2400);
}

function stopRinging(){
  ringing = false;
  if(ringTimer){ clearInterval(ringTimer); ringTimer = null; }
}

/* ---------- Vibração ---------- */
function startVibration(){
  if(!('vibrate' in navigator)) return;
  try{ navigator.vibrate([500,400,500]); }catch(e){}
  vibTimer = setInterval(()=>{ try{ navigator.vibrate([500,400,500]); }catch(e){} }, 2400);
}

function stopVibration(){
  if(vibTimer){ clearInterval(vibTimer); vibTimer = null; }
  if('vibrate' in navigator){ try{ navigator.vibrate(0); }catch(e){} }
}

/* ---------- Cronômetro da chamada ---------- */
function fmt(n){ return String(n).padStart(2,'0'); }

function startCallTimer(){
  seconds = 0;
  timerEl.textContent = '00:00';
  callTimer = setInterval(()=>{
    seconds++;
    timerEl.textContent = fmt(Math.floor(seconds/60)) + ':' + fmt(seconds % 60);
  }, 1000);
}

function stopCallTimer(){
  if(callTimer){ clearInterval(callTimer); callTimer = null; }
}

/* ---------- Câmera do usuário ---------- */
function updateMirror(){
  // espelha apenas quando é a câmera frontal (como um celular de verdade)
  selfVideo.style.transform = (facingMode === 'user') ? 'scaleX(-1)' : 'none';
}

function attachStream(){
  selfVideo.srcObject = localStream;
  selfCam.classList.remove('no-video');
  updateMirror();
  try{ selfVideo.play(); }catch(e){}
  applyMicState();
  applyVideoState();
}

async function startCamera(){
  if(localStream) return true;

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    // Navegador sem suporte, ou página não está em HTTPS (getUserMedia exige
    // contexto seguro: https:// ou localhost).
    console.warn('getUserMedia indisponível (navegador sem suporte ou página fora de HTTPS).');
    selfCam.classList.add('no-video');
    return false;
  }

  const attempts = [
    { video: { facingMode: facingMode }, audio: true },   // ideal: câmera + mic
    { video: true, audio: true },                          // sem exigir facingMode específico
    { video: { facingMode: facingMode }, audio: false },   // só vídeo, com facingMode
    { video: true, audio: false }                          // só vídeo, qualquer câmera
  ];

  for(const constraints of attempts){
    try{
      localStream = await navigator.mediaDevices.getUserMedia(constraints);
      attachStream();
      return true;
    }catch(e){
      console.warn('Falha ao abrir câmera com', constraints, '->', e.name, e.message);
    }
  }

  // Todas as tentativas falharam (permissão negada, câmera em uso por outro
  // app, ou dispositivo sem câmera).
  selfCam.classList.add('no-video');
  return false;
}

/* Alterna entre câmera frontal e traseira */
async function flipCamera(){
  if(flipping || !localStream) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;

  flipping = true;
  flipBtn.classList.add('spin');
  const previous = facingMode;
  facingMode = (facingMode === 'user') ? 'environment' : 'user';

  // para a track de vídeo atual antes de abrir a nova câmera
  localStream.getVideoTracks().forEach(t => t.stop());

  try{
    const newStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { exact: facingMode } },
      audio: false
    });
    const newTrack = newStream.getVideoTracks()[0];

    localStream.getVideoTracks().forEach(t => localStream.removeTrack(t));
    localStream.addTrack(newTrack);

    selfVideo.srcObject = localStream;
    updateMirror();
    try{ await selfVideo.play(); }catch(e){}
    applyVideoState();
  }catch(e){
    // câmera oposta indisponível (ex.: notebook) -> reverte
    facingMode = previous;
    try{
      const back = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facingMode },
        audio: false
      });
      const t = back.getVideoTracks()[0];
      localStream.getVideoTracks().forEach(v => localStream.removeTrack(v));
      localStream.addTrack(t);
      selfVideo.srcObject = localStream;
      updateMirror();
      try{ await selfVideo.play(); }catch(err){}
      applyVideoState();
    }catch(err){
      selfCam.classList.add('no-video');
    }
  }finally{
    flipping = false;
    flipBtn.classList.remove('spin');
  }
}

function stopCamera(){
  if(localStream){
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  selfVideo.srcObject = null;
  selfCam.classList.remove('no-video');
}

function applyMicState(){
  const off = muteMicBtn.classList.contains('off');
  if(localStream) localStream.getAudioTracks().forEach(t => t.enabled = !off);
}

function applyVideoState(){
  const off = videoBtn.classList.contains('off');
  selfCam.classList.toggle('off', off);
  if(localStream) localStream.getVideoTracks().forEach(t => t.enabled = !off);
}

/* ---------- Vídeo do contato ---------- */
remoteVideo.addEventListener('loadeddata', ()=>{
  phone.classList.add('has-remote');
});
remoteVideo.addEventListener('error', ()=>{
  phone.classList.remove('has-remote');
});

/* Toca o vídeo do contato COM SOM.
   Precisa ser chamada de forma SÍNCRONA, direto dentro do clique/toque do
   usuário (sem setTimeout/await antes dela). Safari iOS e Chrome Android só
   permitem iniciar áudio se o play() acontecer dentro do próprio gesto —
   por isso não reiniciamos nem chamamos play() de novo em nenhum outro
   momento fora do clique de "Aceitar". */
function playRemoteNow(){
  try{
    remoteVideo.muted = false;
    const p = remoteVideo.play();
    if(p && typeof p.catch === 'function'){
      p.catch(()=>{
        // Se mesmo assim o navegador bloquear o áudio, ao menos toca mudo
        // (melhor mostrar o vídeo sem som do que não mostrar nada).
        remoteVideo.muted = true;
        remoteVideo.play().catch(()=>{});
      });
    }
  }catch(e){}
}

function stopRemoteVideo(){
  try{ remoteVideo.pause(); remoteVideo.currentTime = 0; }catch(e){}
}

/* ---------- Ações ---------- */
acceptBtn.addEventListener('click', ()=>{
  stopRinging();
  stopVibration();
  ensureAudio();

  setState('connecting');
  callType.textContent  = 'Chamada de vídeo';
  subStatus.textContent = 'Conectando…';

  // Ativa a câmera do usuário IMEDIATAMENTE (dentro do gesto de clique)
  startCamera();

  // Toca o vídeo do contato AGORA, com som, ainda dentro do mesmo clique.
  // A tela só vai exibi-lo quando o estado mudar para "in-call" (CSS),
  // mas a reprodução em si já começa aqui para não perder a permissão
  // de autoplay com áudio no Safari/Chrome mobile.
  playRemoteNow();

  setTimeout(()=>{
    setState('in-call');
    startCallTimer();
  }, 1200);
});

declineBtn.addEventListener('click', ()=>{
  stopRinging();
  stopVibration();
  setState('ended');
  callType.textContent  = 'Chamada de vídeo';
  subStatus.textContent = 'Chamada recusada';
});

endBtn.addEventListener('click', ()=>{
  stopCallTimer();
  stopCamera();
  stopRemoteVideo();
  const dur = timerEl.textContent;
  setState('ended');
  subStatus.textContent = 'Chamada encerrada · ' + dur;
});

restartBtn.addEventListener('click', resetCall);

soundToggle.addEventListener('click', ()=>{
  muted = !muted;
  soundToggle.classList.toggle('muted', muted);
  if(muted) stopRinging();
  else if(state === 'incoming') startRinging();
});

muteMicBtn.addEventListener('click', ()=>{
  muteMicBtn.classList.toggle('off');
  applyMicState();
});

videoBtn.addEventListener('click', ()=>{
  videoBtn.classList.toggle('off');
  applyVideoState();
});

flipBtn.addEventListener('click', flipCamera);

function resetCall(){
  stopCallTimer();
  stopCamera();
  stopRemoteVideo();
  setState('incoming');
  callType.textContent  = 'Chamada de vídeo…';
  subStatus.textContent = 'chamada de vídeo recebida';
  seconds = 0;
  timerEl.textContent = '00:00';
  facingMode = 'user';           // volta para a câmera padrão (frontal)
  updateMirror();
  muteMicBtn.classList.remove('off');
  videoBtn.classList.remove('off');
  selfCam.classList.remove('off');
  startVibration();
  if(!muted) startRinging();
}

/* ---------- Inicialização ---------- */
updateMirror();
startVibration();
if(!muted) startRinging();

// Navegadores bloqueiam áudio até o 1º gesto do usuário
document.addEventListener('pointerdown', function kick(){
  ensureAudio();
  if(!muted && state === 'incoming' && !ringing) startRinging();
}, { once:true });
  </script>
</body>
